name: Hourly Proxy Poster

on:
  schedule:
    - cron: '0 * * * *' # every hour (UTC)
  workflow_dispatch: # manual runs from the Actions tab

# Needed to push the updated history.txt back to main
permissions:
  contents: write

# Prevent overlapping runs from racing on history.txt
concurrency:
  group: hourly-proxy-poster
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ProxGram poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      - name: Commit and push updated history.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f history.txt ] && [ -n "$(git status --porcelain -- history.txt)" ]; then
            git add history.txt
            git commit -m "chore: record posted proxy config in history.txt"
            git push origin HEAD:main
          else
            echo "history.txt unchanged or absent - nothing to commit"
          fi
