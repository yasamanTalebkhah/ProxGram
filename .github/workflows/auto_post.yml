name: Auto Post Proxies

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: proxgram
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true # needed to push history.txt updates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: python -m unittest test_main -v

      - name: Run Proxy Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f history.txt ] && [ -n "$(git status --porcelain -- history.txt)" ]; then
            git add history.txt
          fi
          if [ -f news_history.txt ] && [ -n "$(git status --porcelain -- news_history.txt)" ]; then
            git add news_history.txt
          fi
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update history [skip ci]"
            # Rebase over any history committed by a just-finished run so
            # overlapping 5-minute runs never lose each other's entries.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
